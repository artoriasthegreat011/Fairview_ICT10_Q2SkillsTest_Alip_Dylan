<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>ICT 10</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #e5e7eb;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            max-width: 480px;
            margin: 40px auto;
            padding: 28px;
            border-radius: 12px;
            background: var(--card-bg);
            box-shadow: var(--shadow);
            line-height: 1.5;
        }

        .container {
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 1.75rem;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            margin-top: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        button {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 24px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        h3 {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 24px;
            color: var(--text-primary);
            font-size: 1.1rem;
            letter-spacing: 0.05em;
        }

        span {
            font-weight: normal;
            color: var(--accent-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nonmetals</h1>
        <p>Enter an <b>element symbol</b> to search for it's properties. <i>(Note that capitalization matters.)</i></p>
        <input type="text" id="nonmetal1" placeholder="Nonmetal">
    </div>

    <button py-click="search_nonmetal">Search Element</button>

    <div class="result"></div>
    <h3>SEARCH RESULT</h3>
    <p><b>Element Symbol: <span id="symbol"></span></b></p>
    <p><b>Element Name: <span id="name"></span></b></p>
    <p><b>Atomic Number: <span id="number"></span></b></p>
    <p><b>Atomic Mass: <span id="mass"></span></b></p>

    <script type="py" src="main.py"></script>


</body>
</html>
